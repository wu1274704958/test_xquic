syntax = "proto3";

package mqas.tools.proto.relay;
import "common.proto";

message ReqRelay{
  common.UUID token = 1;
  optional uint32 option = 2;
}

message RespondRelay{
  enum Code{
    success = 0;
    already_exists = 1;
    waiting_peer = 2;
    timeout = 3;
    bad_arguments = 4;
  };
  Code code = 1;
  uint32 id = 2;
  optional common.Address peer_addr = 3;
  optional common.Address self_addr = 4;
}

message ReqReady{}
message RespondReady{}