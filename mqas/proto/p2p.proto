syntax = "proto3";

package mqas.tools.proto.p2p;
import "common.proto";

//data
message PeerData {
    uint32 id = 1;
    string name = 2;
}

enum RetCode{
    ok = 0;
    already_exists = 1;
    not_exists = 2;
    peer_rejected = 3;
    failed = 4;
}

enum ServerPreference {
    SERVER_NO_PREFERENCE = 0;
    SERVER_VOLUNTEER = 1;
    SERVER_REUSABLE = 2;
}

message ClientIpList{
    repeated string ip_list = 1;
    uint32 port = 2;
    repeated Address additional_ipv6_endpoints = 3;
}

message Address {
    string ip = 1;
    uint32 port = 2;
}
//--------------------------------

//lobby 
message ReqPeerList{}

message RespondPeerList{
    repeated PeerData peer_list = 1;
}

message ReqRegistePeer{
    string name = 1;
}

message RespondRegistePeer{
    RetCode ret = 1;
    uint32 id = 2;
}

message ReqUnregistePeer{}

message RespondUnregistePeer{
    RetCode ret = 1;
}

//-------------------------------------

message ConnectPeerData{
    string ip = 1;
    uint32 port = 2;
    uint32 verify_code = 3;
    uint32 send_times = 4; 
    uint32 send_delay = 5;
    uint32 ip_index = 6;
    optional bool use_non_lobby_socket = 7;
}

//helper
message ReqConnectPeer{
    uint32 peer_id = 1;
    optional ClientIpList ip_list = 2;
    uint32 auth_version = 3;
    ServerPreference server_preference = 4;
}

message ReqRespondPeerReqConnect{
    uint32 peer_id = 1;
    bool agree = 2;
    optional ClientIpList ip_list = 3;
    uint32 auth_version = 4;
    ServerPreference server_preference = 5;
}

message RespondConnectPeer{
    uint32 peer_id = 1;
    RetCode ret = 2;
}

message NotifyConnectPeerData{
    uint32 peer_id = 1;
    ConnectPeerData connect_data = 2;
}

message NotifyConnectResult{
    RetCode ret = 1;
    uint32 peer_id = 2;
    bool is_server = 5;
    optional common.UUID verify_token = 10;
    optional Address peer_addr = 6;
    optional string reason = 3;
    optional Address address = 4;
    optional Address relay_addr = 7;
    optional bool use_relay = 8;
    optional bytes relay_token = 9;
    bytes psk_identity = 11;
    bytes psk_secret = 12;
    uint64 psk_issued_at_ms = 13;
    uint64 psk_expires_at_ms = 14;
    bytes negotiation_id = 15;
    optional bool use_non_lobby_socket = 16;
}

message ReqP2PServerReady {
    uint32 peer_id = 1;
    bytes negotiation_id = 2;
}

message NotifyP2PServerReady {
    uint32 peer_id = 1;
    bytes negotiation_id = 2;
}

message NotifyPeerWantConnect{
    PeerData peer = 1;
}

message ReqSubmitRecvPeerKeyCode{
    uint32 peer_id = 1;
    uint32 verify_code = 2;
    uint32 ip_index = 3;
    Address peer_addr = 4;
}
//--------------------------------------------
